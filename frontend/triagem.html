<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triagem</title>
<link rel="stylesheet" href="./css/forms.css">
<style>
  .btn-tv{
    background: #28a745;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;
  }
  .btn-tv:hover{
    background-color: #1e7e34;
  }
  .pacientes-fila{
    margin-bottom: 30px;
    background: #f0f4ff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #d0d8f0;
  }
  .paciente-fila h3{
    margin-top: 0;
    color: #333;
    display: flex;
    justify-content: space-between;
  }
  .paciente-fila h3 span{
    font-size: 13px;
    font-weight: normal;
    color: #666;
  }
  .fila-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #dce4ff; 
  }
  .fila-item strong{font-size: 15px;}
  .fila-item small {color: #888; font-size: 12px;}
  .btn-abrir-tv {
    display: inline-block;
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-abrir-tv:hover{
    background-color: #117a8b;
  }
</style>
</head>
<body>
  <div class="container" style="width: 600px;">
    <div style="display: flex; justify-content:space-between; align-items: center; margin-bottom: 20px">
      <h2 style="margin: 0;">Triagem Hospitalar</h2>
      <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">Abrir Tela da TV</button>
    </div>
    <div class="pacientes-fila">
      <h3>
        Pacientes Cadastrados no Atendimento
        <span>Clique em "Chamar na TV"</span>
      </h3>
      <div id="fila-pacientes">
        <p style="color: #888; text-align: center;">Carregando...</p>
      </div>
      <button onclick="carregarPacientes()" style="margin-top: 8px; background-color: #6c757d; color: white;
      border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">Atualizar lista</button>
    </div>
  </div>
  <script>
    function carregarPacientes() {
      fetch("http://localhost:3000/atendimento")
      .then(r => r.json())
      .then(pacientes => {
        const div = document.getElementById("fila-pacientes")

        const fila = pacientes.filter(p => p.status == "triagem")
        if(fila.length === 0){
          div.innerHTML = "<p style='color:#888; text-align:center;'>Nenhum paciente aguardando</p>"
          return;
        }
        div.innerHTML = "";
        fila.forEach(p => {
          const item = document.createElement("div")
          item.className = "fila-item";
          item.innerHTML = `
          <div>
            <strong>${p.nome}</strong><br>
            <small>CPF: ${p.cpf || "-"} | Tipo: ${p.tipo || "-"}</small>
          </div>
          <button class="btn-tv" onclick="chamarNaTV('${p.nome}')">Chamar na TV</button>`
          div.appendChild(item)
        })
      })
      .catch(() => {
        document.getElementById("fila-pacientes").innerHTML = 
        "<p style='color: red;'>Erro ao carregar pacientes</p>"
      })
    }
    function chamarNaTV(nome) {
      fetch("/tv/chamar", {
        method: 'POST',
        headers: {"Content-type": "application/json"},
        body: JSON.stringify({
          paciente: nome,
          localTipo: "GUICHÊ",
          localNumero: "01"
        })
      }).then(r => r.json())
      .then(() => {
        alert("👌 " + nome + " foi chamado na TV para o Guichê 01!")
      })
    }
    carregarPacientes()
    setInterval(carregarPacientes, 10000)
  </script>
</body>
</html>
